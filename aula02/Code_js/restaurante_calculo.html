<meta charset="utf-8">
<script>
  var conta = Number(prompt("Valor da Conta R$: "));
  var num = Number(prompt("Número de Clientes: "));
  var doce = Number(prompt("Valor da sobremesa inclusa R$: "));
  var individual = conta + doce
  var result = individual / num
  alert("Valor por Cliente R$: " + result.toFixed(2));
</script>
