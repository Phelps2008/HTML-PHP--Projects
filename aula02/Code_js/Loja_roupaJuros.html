<meta charset="utf-8">
<script>
  var preco = Number(prompt("Preço R$: "));
  var avista = preco - (preco * 0.10);          // ou: var avista = preco * 0.90;
  var parcelado = preco / 3;
  var juros = preco * 1.1;
  alert("À Vista R$: " + avista.toFixed(2) + "\nOu 3x de R$: " + parcelado.toFixed(2) + "\nO valor pago em 6x com juros R$: " + juros.toFixed(2));
</script>
