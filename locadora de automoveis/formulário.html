    <div class="container-cadastro">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <h2>Faça seu Cadastro</h2>
                <p>Preencha os dados abaixo para solicitar sua locação</p>
            </div>
            
            <form>
                <div class="form-group">
                    <label for="idNome">Nome Completo</label>
                    <input type="text" name="Nome" id="idNome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form-group">
                    <label>Sexo</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="Sexo" id="idSexof" value="f">
                            <span>Feminino</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="Sexo" id="idSexoM" value="m">
                            <span>Masculino</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Já atingiu a maioridade? (+18)</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="Idade" id="idAges" value="s">
                            <span>Sim</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="Idade" id="idAgen" value="n">
                            <span>Não</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="idBairro">Bairro / Distrito (São Paulo - SP)</label>
                    <input type="text" id="idBairro" list="ListaBairros" placeholder="Selecione ou digite o bairro" required>
                    
                    <datalist id="ListaBairros">
                        <option value="Água Rasa"></option>

                        <option value="Campo Grande"></option>
                        <option value="Cangaíba"></option>
                        <option value="Capão Redondo"></option>
                        <option value="Carrão"></option>
                        <option value="Casa Verde"></option>

                        <option value="Cidade Dutra"></option>

                        <option value="Ermelino Matarazzo"></option>
                        <option value="Freguesia do Ó"></option>
                        <option value="Grajaú"></option>
                        <option value="Guaianases"></option>
                        <option value="Iguatemi"></option>
                        <option value="Ipiranga"></option>
                        <option value="Itaim Bibi"></option>
                        <option value="Itaim Paulista"></option>
                        <option value="Itaquera"></option>
                        <option value="Jabaquara"></option>
                        <option value="Jaçanã"></option>
                        <option value="Jaguara"></option>
                        <option value="Jaguaré"></option>
                        <option value="Jardim Ângela"></option>
                        <option value="Jardim Helena"></option>
                        <option value="Jardim Paulista"></option>
                        <option value="Jardim São Luís"></option>
                        <option value="José Bonifácio"></option>
                        <option value="Lajeado"></option>
                        <option value="Lapa"></option>
                        <option value="Liberdade"></option>
                        <option value="Limão"></option>
                        <option value="Mandaqui"></option>
                        <option value="Marsilac"></option>

                        <option value="Vila Prudente"></option>
                        <option value="Vila Sônia"></option>
                    </datalist>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="idCEP">CEP</label>
                        <input type="tel" id="idCEP" placeholder="00000-000" required>
                    </div>
                    <div class="form-group">
                        <label for="idCpf">CPF</label>
                        <input type="tel" id="idCpf" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="idEmail">E-mail</label>
                        <input type="email" id="idEmail" placeholder="seuemail@provedor.com" required>
                    </div>
                    <div class="form-group">
                        <label for="idTelefone">Telefone / WhatsApp</label>
                        <input type="tel" id="idTelefone" placeholder="(11) 99999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="idCNH">Categoria da CNH</label>
                    <input type="text" id="idCNH" list="listaCNH" placeholder="Selecione a categoria habilitada" required>
                    <datalist id="listaCNH">
                        <option value="ACC: Ciclomotores (até 50 cilindradas)."></option>
                        <option value="A: Motos, motonetas e triciclos."></option>
                        <option value="B: Carros de passeio e caminhonetes (até 8 lugares)."></option>
                        <option value="C: Caminhões e veículos de carga (acima de 3,5 toneladas)."></option>
                        <option value="D: Ônibus, micro-ônibus e vans (mais de 8 passageiros)."></option>
                        <option value="E: Veículos com trailers, carretas e articulações pesadas."></option>
                        <option value="AB: Moto + Carro de passeio."></option>
                        <option value="AC: Moto + Caminhão."></option>
                        <option value="AD: Moto + Ônibus/Vans."></option>
                        <option value="AE: Moto + Carreta/Veículos articulados."></option>
                    </datalist>
                </div>

                <button type="submit" class="btn-enviar-form">Concluir Cadastro</button>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            $('#idTelefone').mask('(00) 00000-0000');
            $('#idCpf').mask('000.000.000-00');
            $('#idCEP').mask('00000-000');
        });
    </script>
       
</body>
